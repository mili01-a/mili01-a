<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="img" aria-label="divisor">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="grad-purple" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7e22ce" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#a855f7"/>
      <stop offset="0.6" stop-color="#c084fc"/>
      <stop offset="0.85" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;900" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="900" height="2" fill="#7e22ce" fill-opacity="0.3"/>
  <rect x="0" y="4" width="900" height="4" rx="2" fill="url(#grad-purple)" filter="url(#glow)"/>
  <circle cx="450" cy="6" r="3.5" fill="#e9d5ff" filter="url(#glow)">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
