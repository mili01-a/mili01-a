<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Tarjetas de habilidades animadas">
  <defs>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#170c24" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f051d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-skills">
      <rect x="250" y="15" width="0" height="50">
        <animate attributeName="width" from="0" to="260" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
    .title-skills { font-family: 'Cinzel', Georgia, serif; font-size: 32px; font-weight: 700; fill: #ffffff; letter-spacing: 8px; }
    .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #f3e8ff; letter-spacing: 0.5px; }
    .card-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #c084fc; letter-spacing: 1px; text-transform: uppercase; }
    .bullet-point { fill: #c084fc; }
  </style>
  <rect width="760" height="320" rx="18" fill="#0f051d"/>
  <rect width="760" height="320" rx="18" fill="url(#bg-glow)"/>
  <rect x="1" y="1" width="758" height="318" rx="17" fill="none" stroke="#c084fc" stroke-opacity="0.25">
    <animate attributeName="stroke-opacity" values="0.15;0.55;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#clip-skills)" filter="url(#glow-purple)">
    <text x="380" y="52" text-anchor="middle" class="title-skills">SKILLS</text>
  </g>
  <rect x="500" y="24" width="3" height="30" fill="#c084fc">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="x" from="260" to="500" dur="1s" begin="0.2s" fill="freeze"/>
  </rect>
  <line x1="330" y1="68" x2="430" y2="68" stroke="#c084fc" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.8s" begin="1.1s" fill="freeze"/>
  </line>

  <!-- Tarjetas Cuadradas con animación de aparición individual -->
  <g transform="translate(30, 95)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="30 110" to="30 95" dur="0.5s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect width="220" height="85" rx="12" fill="url(#card-grad)"/><rect width="220" height="85" rx="12" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="3" class="bullet-point" filter="url(#glow-purple)"/>
    <text x="42" y="38" class="card-title">MS Excel</text><text x="42" y="56" class="card-subtitle">Specialist &amp; Expert</text>
  </g>

  <g transform="translate(270, 95)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="270 110" to="270 95" dur="0.5s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect width="220" height="85" rx="12" fill="url(#card-grad)"/><rect width="220" height="85" rx="12" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="3" class="bullet-point" filter="url(#glow-purple)"/>
    <text x="42" y="38" class="card-title">Liderazgo</text><text x="42" y="56" class="card-subtitle">Trabajo en Equipo</text>
  </g>

  <g transform="translate(510, 95)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="510 110" to="510 95" dur="0.5s" begin="1.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect width="220" height="85" rx="12" fill="url(#card-grad)"/><rect width="220" height="85" rx="12" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="3" class="bullet-point" filter="url(#glow-purple)"/>
    <text x="42" y="38" class="card-title">Inglés B1</text><text x="42" y="56" class="card-subtitle">Nivel Intermedio</text>
  </g>

  <g transform="translate(150, 200)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="150 215" to="150 200" dur="0.5s" begin="2.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect width="220" height="85" rx="12" fill="url(#card-grad)"/><rect width="220" height="85" rx="12" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="3" class="bullet-point" filter="url(#glow-purple)"/>
    <text x="42" y="38" class="card-title">Canva</text><text x="42" y="56" class="card-subtitle">Diseño Digital</text>
  </g>

  <g transform="translate(390, 200)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="390 215" to="390 200" dur="0.5s" begin="2.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <rect width="220" height="85" rx="12" fill="url(#card-grad)"/><rect width="220" height="85" rx="12" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
    <circle cx="28" cy="42" r="3" class="bullet-point" filter="url(#glow-purple)"/>
    <text x="42" y="38" class="card-title">Design Thinking</text><text x="42" y="56" class="card-subtitle">Innovación UTP</text>
  </g>
</svg>

