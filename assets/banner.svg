<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-label="Milagro A. - Estudiante de Ciencias, Tecnología e Innovación">
  <defs>
    <radialGradient id="bg-glow1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#2e1065" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f051d"/>
      <animate attributeName="cx" values="30%;70%;30%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30%;70%;30%" dur="10s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="bg-glow2" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f051d" stop-opacity="0"/>
      <animate attributeName="cx" values="70%;20%;70%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70%;30%;70%" dur="8s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="text-purple-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f3e8ff"/>
      <stop offset="80%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="purple-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#581c87" flood-opacity="0.5"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;1,300&amp;display=swap');
    .brand-title { font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 58px; fill: url(#text-purple-light); letter-spacing: 4px; }
    .brand-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 13px; fill: #e9d5ff; letter-spacing: 4px; text-transform: uppercase; }
    .brand-tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 300; font-style: italic; font-size: 13px; fill: #d8b4fe; letter-spacing: 1.5px; }
  </style>
  <rect width="760" height="260" rx="18" fill="#0f051d" filter="url(#purple-shadow)"/>
  <rect width="760" height="260" rx="18" fill="url(#bg-glow1)"/>
  <rect width="760" height="260" rx="18" fill="url(#bg-glow2)"/>
  <path d="M -100 130 Q 180 50 450 160 T 860 100" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25">
    <animate attributeName="d" values="M -100 130 Q 180 50 450 160 T 860 100; M -100 100 Q 200 180 450 80 T 860 150; M -100 130 Q 180 50 450 160 T 860 100" dur="12s" repeatCount="indefinite"/>
  </path>
  <rect x="1" y="1" width="758" height="258" rx="17" fill="none" stroke="#c084fc" stroke-opacity="0.25">
    <animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="30" cy="24" r="4.5" fill="#e9d5ff" opacity="0.4"/>
  <circle cx="46" cy="24" r="4.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="62" cy="24" r="4.5" fill="#a855f7" opacity="0.4"/>
  <g filter="url(#soft-glow)">
    <text x="380" y="125" text-anchor="middle" class="brand-title" opacity="0">
      MILAGRO A.
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
      <animate attributeName="y" from="135" to="125" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </text>
  </g>
  <line x1="180" y1="152" x2="580" y2="152" stroke="url(#text-purple-light)" stroke-width="1.5" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="0.8s" fill="freeze"/>
  </line>
  <circle cx="380" cy="152" r="3" fill="#ffffff" filter="url(#soft-glow)" opacity="0">
    <animate attributeName="opacity" values="0;1;0.5;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text x="380" y="188" text-anchor="middle" class="brand-subtitle" opacity="0">
    Ciencias · Tecnología · Innovación
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
  </text>
  <text x="380" y="214" text-anchor="middle" class="brand-tagline" opacity="0">
    Liderazgo con propósito y desarrollo sostenible
    <animate attributeName="opacity" from="0" to="0.9" dur="0.8s" begin="1.4s" fill="freeze"/>
  </text>
</svg>
